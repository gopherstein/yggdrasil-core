name: CI

# Changes that touch only prose, images, or issue templates build nothing,
# so they do not run CI. The user guide (docs/user-guide/guide.json) is not
# ignored: the go job validates it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
      - "docs/screenshots/**"
      - "docs/brand/**"
      - "screenshots/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
      - "docs/screenshots/**"
      - "docs/brand/**"
      - "screenshots/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"

# A new push to a pull request cancels its older run. Runs on main always
# finish, so every merged commit is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Go checks, the user guide, and the cross-compile share one runner: the
  # module and build caches are already warm, and each extra job would repeat
  # checkout and Go setup.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: User guide
        run: |
          python3 scripts/test_publish_docs.py
          python3 scripts/publish-docs.py --destination "$RUNNER_TEMP/docs-validation" --version 0.0.0-test --commit "$GITHUB_SHA"
      - name: Changelog fragments
        run: |
          python3 scripts/test_changelog.py
          python3 scripts/changelog.py check
      - name: Translation glossary
        run: |
          python3 scripts/test_i18n.py
          python3 scripts/i18n.py check
      - name: Format check
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' \
            -not -path './web/*' \
            -not -path './.gocache/*' \
            -not -path './vendor/*' \
            -not -path '*/node_modules/*'))
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Test
        run: go test ./... -coverprofile=coverage.out
      - name: Cross-compile daemon and yggctl
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            echo "::group::${target}"
            go build -o "bin/${GOOS}-${GOARCH}/yggdrasil-daemon${ext}" ./cmd/daemon
            go build -o "bin/${GOOS}-${GOARCH}/yggctl${ext}" ./cmd/devctl
            echo "::endgroup::"
          done
      - name: Upload coverage profile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 1
          if-no-files-found: error

  coverage-badge:
    needs: go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: actions/download-artifact@v7
        with:
          name: coverage-profile
          path: .
      - name: Publish coverage badge
        env:
          PUBLISH_COVERAGE_BADGE: "1"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/publish-coverage-badge.sh
          ./scripts/publish-coverage-badge.sh coverage.out

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm exec tsc -b --pretty false
      - run: pnpm test
      - run: pnpm build
